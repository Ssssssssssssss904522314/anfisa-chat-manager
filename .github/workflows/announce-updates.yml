name: Automatic bot update announcements

on:
  push:
    branches:
      - main
    paths:
      - 'index.js'
      - 'package.json'
      - '.github/workflows/announce-updates.yml'
  workflow_dispatch:
    inputs:
      title:
        description: 'Название обновления (для ручного теста)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Publish update with relevant premium emoji
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          UPDATE_CHANNEL_ID: ${{ secrets.UPDATE_CHANNEL_ID }}
          MANUAL_TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          channel = os.environ.get("UPDATE_CHANNEL_ID", "")
          if not token or not channel:
              raise SystemExit("Set TELEGRAM_BOT_TOKEN and UPDATE_CHANNEL_ID in repository Actions secrets.")

          api = f"https://api.telegram.org/bot{token}/"
          def call(method, payload=None):
              req = urllib.request.Request(api + method, data=json.dumps(payload or {}).encode(), headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram {method} failed: {result}")
              return result["result"]

          title = (os.environ.get("MANUAL_TITLE") or "Новое улучшение бота").splitlines()[0]
          text = (
              "✨ Anfisa | CHAT-MANAGER\n\n"
              "🚀 Новое обновление!\n"
              f"📰 {title}\n\n"
              "🛡️ Мы продолжаем улучшать бота и добавлять полезные функции. Следите за новостями!"
          )

          # Read custom emoji IDs from the NewsEmoji pack.
          pack = call("getStickerSet", {"name":"NewsEmoji"})
          emoji_map = {}
          for sticker in pack.get("stickers", []):
              emoji, custom_id = sticker.get("emoji"), sticker.get("custom_emoji_id")
              if emoji and custom_id:
                  emoji_map.setdefault(emoji, custom_id)

          # Replace matching emoji visually with premium custom emoji entities.
          entities, occupied = [], []
          for emoji, custom_id in sorted(emoji_map.items(), key=lambda item: len(item[0]), reverse=True):
              start = 0
              while True:
                  pos = text.find(emoji, start)
                  if pos < 0:
                      break
                  end = pos + len(emoji)
                  if any(not (end <= a or pos >= b) for a, b in occupied):
                      start = end
                      continue
                  entities.append({
                      "type": "custom_emoji",
                      "offset": len(text[:pos].encode("utf-16-le")) // 2,
                      "length": len(emoji.encode("utf-16-le")) // 2,
                      "custom_emoji_id": custom_id
                  })
                  occupied.append((pos, end))
                  start = end

          call("sendMessage", {
              "chat_id": channel,
              "text": text,
              "entities": entities,
              "link_preview_options": {"is_disabled": True}
          })
          print(f"Announcement sent; matching premium emoji: {len(entities)}")
          PY
